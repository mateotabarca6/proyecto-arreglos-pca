<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nombre del proyecto · Catálogo</title>
<meta name="description" content="Catálogo de obras con partituras, audios e información.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F3F4F6;
    --ink: #14171C;
    --ink-soft: #5A616C;
    --line: #DCDFE4;
    --accent: #7A1F2B;
    --accent-ink: #FFFFFF;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --sans: "Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.55; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { width: min(1200px, 100% - 3rem); margin-inline: auto; }

  /* Barra superior */
  .topbar { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .topbar .wrap { display: flex; align-items: center; gap: 2rem; height: 68px; }
  .brand { font-family: var(--serif); font-size: 1.5rem; font-weight: 500; letter-spacing: -.01em; text-decoration: none; white-space: nowrap; }
  .nav { display: flex; gap: 1.5rem; font-size: .95rem; }
  .nav a { text-decoration: none; color: var(--ink-soft); }
  .nav a:hover { color: var(--ink); }
  .search { margin-left: auto; position: relative; width: min(320px, 100%); }
  .search input {
    width: 100%; font: inherit; font-size: .95rem; padding: .55rem .9rem;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
  }
  .search input::placeholder { color: var(--ink-soft); }
  .search input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px rgba(122,31,43,.18); }

  /* Cabecera de catálogo */
  .intro { padding: 3rem 0 2rem; border-bottom: 1px solid var(--line); }
  .intro h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.05; letter-spacing: -.02em; margin: 0 0 .75rem; }
  .intro p { margin: 0; color: var(--ink-soft); max-width: 62ch; font-size: 1.05rem; }

  /* Catálogo */
  .shop { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 3rem; padding: 2.5rem 0 4rem; }
  .filters h2 { font-size: .85rem; font-weight: 600; margin: 0 0 .75rem; }
  .filters ul { list-style: none; margin: 0 0 2rem; padding: 0; }
  .filters li + li { margin-top: .15rem; }
  .filters button {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: .4rem 0;
    display: flex; justify-content: space-between; color: var(--ink-soft); font-size: .95rem;
  }
  .filters button:hover { color: var(--ink); }
  .filters button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
  .filters .n { font-variant-numeric: tabular-nums; }
  .filters select {
    width: 100%; font: inherit; font-size: .95rem; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
  }

  .results-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.25rem; color: var(--ink-soft); font-size: .95rem; }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2rem 1.5rem; }

  .card { display: flex; flex-direction: column; height: 100%; }
  .cover-btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; }
  .cover {
    position: relative; aspect-ratio: 3 / 4; border-radius: 3px; overflow: hidden; color: #fff;
    display: flex; flex-direction: column; justify-content: space-between; padding: 1.25rem;
    box-shadow: 0 1px 2px rgba(20,23,28,.18), 0 8px 20px -10px rgba(20,23,28,.35);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cover::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(255,255,255,.35); pointer-events: none; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover .c-top { font-size: .7rem; letter-spacing: .08em; opacity: .85; position: relative; }
  .cover .c-title { font-family: var(--serif); font-size: 1.6rem; line-height: 1.1; position: relative; }
  .cover .c-bottom { font-size: .8rem; opacity: .85; position: relative; }
  .cover-btn:hover .cover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(20,23,28,.2), 0 14px 26px -10px rgba(20,23,28,.4); }
  .card h3 { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; line-height: 1.2; margin: 1rem 0 .15rem; }
  .card h3 button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit; }
  .card h3 button:hover { color: var(--accent); }
  .card .sub { color: var(--ink-soft); font-size: .9rem; margin: 0; }
  .card .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: .9rem; }
  .price { font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; }
  .listen {
    display: inline-flex; align-items: center; gap: .45rem; font-size: .85rem; font-weight: 500; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); padding: .35rem .75rem; border-radius: 6px;
  }
  .listen:hover { border-color: var(--ink); }
  .listen svg { width: 10px; height: 10px; fill: currentColor; }
  .listen[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .empty { padding: 3rem 0; color: var(--ink-soft); }

  /* Botones */
  .btn {
    font: inherit; font-weight: 500; font-size: .95rem; cursor: pointer; text-decoration: none; display: inline-block;
    padding: .65rem 1.25rem; border-radius: 6px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); text-align: center;
  }
  .btn:hover { background: var(--ink); color: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.12); }

  /* Ficha de obra */
  dialog { border: 0; padding: 0; border-radius: 8px; width: min(980px, calc(100% - 2rem)); max-height: calc(100% - 2rem); color: var(--ink); background: var(--bg); }
  dialog::backdrop { background: rgba(20,23,28,.55); }
  .d-body { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 2.5rem; padding: 2.5rem; }
  .d-close { position: absolute; top: .75rem; right: .75rem; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--surface); cursor: pointer; font-size: 1.25rem; line-height: 1; }
  .d-close:hover { background: var(--line); }
  .d-info h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.1; letter-spacing: -.01em; margin: 0 0 .25rem; }
  .d-info .sub { color: var(--ink-soft); margin: 0 0 1.25rem; }
  .d-info p { max-width: 62ch; margin: 0 0 1rem; }
  .specs { display: grid; grid-template-columns: auto 1fr; gap: .45rem 1.5rem; margin: 1.5rem 0; padding: 1.25rem 0; border-block: 1px solid var(--line); font-size: .95rem; }
  .specs dt { color: var(--ink-soft); }
  .specs dd { margin: 0; }
  .d-audio { background: var(--surface); padding: 1rem; border-radius: 6px; margin-bottom: 1.25rem; }
  .d-audio label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .5rem; }
  .d-audio audio { width: 100%; display: block; }
  .d-actions { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
  .d-price { font-family: var(--serif); font-size: 1.6rem; margin-right: .75rem; }
  .score-frame iframe { width: 100%; height: min(70vh, 640px); border: 1px solid var(--line); border-radius: 6px; margin-top: 1.25rem; background: #fff; }

  /* Pie */
  footer { border-top: 1px solid var(--line); background: var(--surface); padding: 2.5rem 0; color: var(--ink-soft); font-size: .92rem; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.5rem; }
  footer h2 { font-family: var(--serif); font-weight: 500; color: var(--ink); font-size: 1.15rem; margin: 0 0 .4rem; }
  footer p { margin: 0; max-width: 52ch; }

  @media (max-width: 860px) {
    .nav { display: none; }
    .shop { grid-template-columns: 1fr; gap: 1.5rem; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .filters ul { display: none; }
    .filters .cat-select { display: block; }
    .d-body { grid-template-columns: 1fr; padding: 1.5rem; gap: 1.5rem; }
    .d-cover-col { max-width: 220px; }
  }
  @media (min-width: 861px) { .filters .cat-select { display: none; } }
  @media (prefers-reduced-motion: reduce) { .cover { transition: none; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#" id="brand">Nombre del proyecto</a>
    <nav class="nav" aria-label="Principal">
      <a href="#catalogo">Catálogo</a>
      <a href="#proyecto">El proyecto</a>
      <a href="#contacto">Contacto</a>
    </nav>
    <div class="search">
      <input type="search" id="q" placeholder="Buscar obra, instrumento o año" aria-label="Buscar en el catálogo">
    </div>
  </div>
</header>

<section class="intro">
  <div class="wrap">
    <h1 id="headline">Catálogo de obras</h1>
    <p id="tagline"></p>
  </div>
</section>

<main class="wrap shop" id="catalogo">
  <aside class="filters" aria-label="Filtros">
    <div class="cat-select">
      <h2><label for="cat-select">Categoría</label></h2>
      <select id="cat-select"></select>
    </div>
    <div>
      <h2>Categoría</h2>
      <ul id="cats"></ul>
    </div>
    <div>
      <h2><label for="sort">Ordenar por</label></h2>
      <select id="sort">
        <option value="recent">Más recientes</option>
        <option value="title">Título (A–Z)</option>
        <option value="duration">Duración</option>
      </select>
    </div>
  </aside>

  <section aria-live="polite">
    <div class="results-head"><span id="count"></span></div>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>No hay obras que coincidan con la búsqueda.</p>
  </section>
</main>

<footer id="contacto">
  <div class="wrap">
    <div id="proyecto">
      <h2>El proyecto</h2>
      <p id="about"></p>
    </div>
    <div>
      <h2>Contacto</h2>
      <p><a id="email" href="#"></a></p>
    </div>
  </div>
</footer>

<dialog id="detail" aria-labelledby="d-title">
  <button class="d-close" type="button" id="d-close" aria-label="Cerrar ficha">&times;</button>
  <div class="d-body" id="d-body"></div>
</dialog>

<script>
/* =========================================================
   CONTENIDO: edita solo esta sección.
   Carpetas junto a index.html:
     audio/       → .mp3
     partituras/  → .pdf
     portadas/    → .jpg o .png (opcional)
   ========================================================= */
const PROJECT = {
  name: "Nombre del proyecto",
  headline: "Catálogo de obras",
  tagline: "Partituras, grabaciones y notas de cada obra del proyecto.",
  about: "Aquí va una presentación breve y seria del proyecto: quién lo compone, qué lo define y qué encontrará el visitante en el catálogo.",
  email: "contacto@ejemplo.com"
};

/* price: número (euros), texto ("Gratis", "Consultar") o vacío.
   buy:   enlace de compra (Stripe, Gumroad, PayPal, etc.). Si no hay, se ofrece la descarga directa.
   cover: imagen opcional. Si no la pones, se genera una portada tipográfica. */
const WORKS = [
  {
    title: "Obra de ejemplo I",
    subtitle: "Para piano solo",
    category: "Piano",
    year: 2025,
    duration: "4:20",
    instrumentation: "Piano",
    key: "Re menor",
    pages: 8,
    description: "Descripción de la obra: contexto de composición, estructura, carácter y cualquier dato que ayude a quien vaya a interpretarla o escucharla.\n\nPuedes escribir varios párrafos separándolos con una línea en blanco.",
    audio: "audio/obra-01.mp3",
    score: "partituras/obra-01.pdf",
    cover: "",
    price: 6,
    buy: ""
  },
  {
    title: "Obra de ejemplo II",
    subtitle: "Para cuarteto de cuerda",
    category: "Cámara",
    year: 2025,
    duration: "7:05",
    instrumentation: "2 violines, viola, violonchelo",
    key: "Sol mayor",
    pages: 24,
    description: "Segunda obra del catálogo. Sustituye este texto por la información real: movimientos, estreno, intérpretes.",
    audio: "audio/obra-02.mp3",
    score: "partituras/obra-02.pdf",
    cover: "",
    price: 12,
    buy: ""
  },
  {
    title: "Obra de ejemplo III",
    subtitle: "Para coro mixto a cuatro voces",
    category: "Coral",
    year: 2024,
    duration: "3:40",
    instrumentation: "SATB a cappella",
    key: "Mi bemol mayor",
    pages: 6,
    description: "Tercera obra de muestra. Si hay texto cantado, indica aquí su autoría y una nota breve sobre él.",
    audio: "audio/obra-03.mp3",
    score: "partituras/obra-03.pdf",
    cover: "",
    price: "Gratis",
    buy: ""
  },
  {
    title: "Obra de ejemplo IV",
    subtitle: "Para voz y piano",
    category: "Piano",
    year: 2024,
    duration: "5:10",
    instrumentation: "Voz y piano",
    key: "La menor",
    pages: 10,
    description: "Cuarta obra de muestra. Borra las que no necesites o copia un bloque para añadir más.",
    audio: "audio/obra-04.mp3",
    score: "partituras/obra-04.pdf",
    cover: "",
    price: 8,
    buy: ""
  }
];

/* =========================================================
   CÓDIGO: no hace falta tocarlo
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

document.title = PROJECT.name + " · Catálogo";
$("#brand").textContent = PROJECT.name;
$("#headline").textContent = PROJECT.headline;
$("#tagline").textContent = PROJECT.tagline;
$("#about").textContent = PROJECT.about;
$("#email").textContent = PROJECT.email;
$("#email").href = "mailto:" + PROJECT.email;

const CATEGORIES = ["Todas", ...new Set(WORKS.map(w => w.category).filter(Boolean))];
const COVER_COLORS = ["#1F2A44", "#5B1A26", "#2C4739", "#3B3F47", "#4A3A2B", "#35405C"];
const colorFor = cat => COVER_COLORS[Math.max(0, [...new Set(WORKS.map(w => w.category))].indexOf(cat)) % COVER_COLORS.length];

const state = { cat: "Todas", sort: "recent", q: "" };
const secs = d => { const p = String(d || "0:0").split(":").map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
const priceText = p => p === undefined || p === null || p === "" ? "Gratis"
  : typeof p === "number" ? p.toLocaleString("es-ES", { style: "currency", currency: "EUR" }) : String(p);

function coverHTML(w) {
  const bg = colorFor(w.category);
  return `<div class="cover" style="background:${bg}">
    ${w.cover ? `<img src="${esc(w.cover)}" alt="" loading="lazy">` : `
      <span class="c-top">${esc(PROJECT.name)}</span>
      <span class="c-title">${esc(w.title)}</span>
      <span class="c-bottom">${esc(w.instrumentation || w.subtitle || "")}</span>`}
  </div>`;
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  let list = WORKS.map((w, i) => ({ ...w, _i: i })).filter(w =>
    (state.cat === "Todas" || w.category === state.cat) &&
    (!q || [w.title, w.subtitle, w.category, w.instrumentation, w.key, w.year].join(" ").toLowerCase().includes(q)));
  if (state.sort === "title") list.sort((a, b) => a.title.localeCompare(b.title, "es"));
  else if (state.sort === "duration") list.sort((a, b) => secs(a.duration) - secs(b.duration));
  else list.sort((a, b) => (b.year || 0) - (a.year || 0));
  return list;
}

function renderFilters() {
  $("#cats").innerHTML = CATEGORIES.map(c => {
    const n = c === "Todas" ? WORKS.length : WORKS.filter(w => w.category === c).length;
    return `<li><button type="button" data-cat="${esc(c)}" aria-pressed="${c === state.cat}"><span>${esc(c)}</span><span class="n">${n}</span></button></li>`;
  }).join("");
  $("#cat-select").innerHTML = CATEGORIES.map(c => `<option ${c === state.cat ? "selected" : ""}>${esc(c)}</option>`).join("");
  document.querySelectorAll("#cats button").forEach(b => b.addEventListener("click", () => { state.cat = b.dataset.cat; renderFilters(); renderGrid(); }));
}

/* Un solo audio de vista previa a la vez */
let preview = null, previewBtn = null;
function stopPreview() {
  if (preview) { preview.pause(); preview = null; }
  if (previewBtn) { previewBtn.setAttribute("aria-pressed", "false"); previewBtn.lastChild.textContent = "Escuchar"; previewBtn = null; }
}
function togglePreview(btn, src) {
  if (previewBtn === btn) { stopPreview(); return; }
  stopPreview();
  preview = new Audio(src);
  previewBtn = btn;
  btn.setAttribute("aria-pressed", "true");
  btn.lastChild.textContent = "Detener";
  preview.addEventListener("ended", stopPreview);
  preview.addEventListener("error", stopPreview);
  preview.play().catch(stopPreview);
}

function renderGrid() {
  stopPreview();
  const list = filtered();
  $("#count").textContent = list.length === 1 ? "1 obra" : list.length + " obras";
  $("#empty").hidden = list.length > 0;
  $("#grid").innerHTML = list.map(w => `
    <li>
      <article class="card">
        <button class="cover-btn" type="button" data-open="${w._i}" aria-label="Ver ficha de ${esc(w.title)}">${coverHTML(w)}</button>
        <h3><button type="button" data-open="${w._i}">${esc(w.title)}</button></h3>
        <p class="sub">${esc(w.subtitle || "")}</p>
        <div class="row">
          <span class="price">${esc(priceText(w.price))}</span>
          ${w.audio ? `<button class="listen" type="button" data-audio="${esc(w.audio)}" aria-pressed="false"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z"/></svg><span>Escuchar</span></button>` : ""}
        </div>
      </article>
    </li>`).join("");
  document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openDetail(+b.dataset.open)));
  document.querySelectorAll("[data-audio]").forEach(b => b.addEventListener("click", () => togglePreview(b, b.dataset.audio)));
}

const dlg = $("#detail");
function openDetail(i) {
  stopPreview();
  const w = WORKS[i];
  const paras = String(w.description || "").split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join("");
  const specs = [["Año", w.year], ["Duración", w.duration], ["Instrumentación", w.instrumentation], ["Tonalidad", w.key], ["Páginas", w.pages], ["Categoría", w.category]]
    .filter(s => s[1]).map(s => `<dt>${s[0]}</dt><dd>${esc(s[1])}</dd>`).join("");
  const main = w.buy
    ? `<a class="btn primary" href="${esc(w.buy)}" target="_blank" rel="noopener">Comprar partitura</a>`
    : (w.score ? `<a class="btn primary" href="${esc(w.score)}" download>Descargar partitura</a>` : "");
  $("#d-body").innerHTML = `
    <div class="d-cover-col">${coverHTML(w)}</div>
    <div class="d-info">
      <h2 id="d-title">${esc(w.title)}</h2>
      <p class="sub">${esc(w.subtitle || "")}</p>
      ${paras}
      <dl class="specs">${specs}</dl>
      ${w.audio ? `<div class="d-audio"><label for="d-player">Grabación</label><audio id="d-player" controls preload="none" src="${esc(w.audio)}"></audio></div>` : ""}
      <div class="d-actions">
        <span class="d-price">${esc(priceText(w.price))}</span>
        ${main}
        ${w.score ? `<button class="btn" type="button" id="d-score" aria-expanded="false">Vista previa de la partitura</button>` : ""}
        ${w.audio ? `<a class="btn" href="${esc(w.audio)}" download>Descargar audio</a>` : ""}
      </div>
      <div class="score-frame" id="d-frame"></div>
    </div>`;
  const sb = $("#d-score");
  if (sb) sb.addEventListener("click", () => {
    const fr = $("#d-frame"), open = !fr.firstChild;
    fr.innerHTML = open ? `<iframe src="${esc(w.score)}" title="Partitura de ${esc(w.title)}"></iframe>` : "";
    sb.textContent = open ? "Ocultar partitura" : "Vista previa de la partitura";
    sb.setAttribute("aria-expanded", String(open));
  });
  dlg.showModal();
}
$("#d-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { $("#d-body").innerHTML = ""; });

$("#q").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; renderGrid(); });
$("#cat-select").addEventListener("change", e => { state.cat = e.target.value; renderFilters(); renderGrid(); });

renderFilters();
renderGrid();
</script>
</body>
</html>
